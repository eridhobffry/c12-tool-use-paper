name: Build paper
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf
